{% extends "base.html" %}
{% from "partials/macros.html" import icon %}
{% block title %}{{ title }}{% endblock %}
{% block content %}
<div class="card" style="max-width:560px;margin:40px auto;text-align:center;padding:40px">
  <div class="mono muted">Error {{ code }}</div>
  <h1>{{ title }}</h1>
  <p class="muted">{{ message }}</p>
  <a class="btn btn-primary" href="{{ url_for('main.home') }}">{{ icon('home') }} Back to home</a>
</div>
{% endblock %}
